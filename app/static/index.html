<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TKE · Delivery Governance</title>
<link rel="stylesheet" href="/style.css">
<script src="/dashboard.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#reviews">TKE<span>Governance</span></a>
    <nav aria-label="Primary">
      <button class="nav-item" id="nav-reviews">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 1.5l6 3.5v6L8 14.5 2 11V5z"/><path d="M8 1.5V8m0 0l6-3.5M8 8L2 4.5" stroke="#fff" stroke-width="1.4" fill="none"/></svg>
        Reviews
      </button>
      <button class="nav-item" id="nav-components">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2.4M8 12.1v2.4M1.5 8h2.4M12.1 8h2.4M3.4 3.4l1.7 1.7M10.9 10.9l1.7 1.7M12.6 3.4l-1.7 1.7M5.1 10.9l-1.7 1.7"/></svg>
        Components
      </button>
    </nav>
  </aside>

  <main class="main">
    <div id="message" class="alert" role="status" aria-live="polite" hidden></div>

    <!-- ============ Reviews overview ============ -->
    <div id="view-reviews">
      <div class="page-head">
        <h1>Reviews</h1>
        <button id="refresh" class="btn">Refresh</button>
      </div>
      <section class="stats" id="metrics" aria-label="Review statistics"></section>
      <section class="card">
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr>
              <th>Decision</th><th>Repository</th><th>Review</th>
              <th>Duration</th><th>Dojo sync</th><th>Created</th>
            </tr></thead>
            <tbody id="reviews"></tbody>
          </table>
        </div>
        <p id="empty" class="muted" hidden>No reviews yet.</p>
      </section>
      <p class="muted meta-line" id="updated"></p>
    </div>

    <!-- ============ Review detail ============ -->
    <div id="view-detail" hidden>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="#reviews">Reviews</a><span class="sep">/</span><span id="crumb-id"></span>
      </nav>
      <div class="detail-head">
        <div class="detail-title">
          <h1 id="detail-title"></h1>
          <div class="review-id" id="detail-rid"></div>
        </div>
        <div class="detail-actions">
          <button id="copy-link" class="btn">Copy link</button>
          <button id="copy-curl" class="btn">Copy curl</button>
        </div>
      </div>
      <nav class="tabs" id="detail-tabs" role="tablist" aria-label="Review sections"></nav>
      <div id="detail-panel"></div>
    </div>

    <!-- ============ Components ============ -->
    <div id="view-components" hidden>
      <div class="page-head">
        <h1>Components</h1>
        <div class="head-actions">
          <span class="muted meta-line" id="comp-updated"></span>
          <button id="comp-refresh" class="btn">Refresh</button>
        </div>
      </div>
      <div id="comp-banner" class="alert" role="alert" hidden></div>
      <div id="comp-grid" class="comp-grid"></div>
      <p id="comp-empty" class="muted" hidden>Could not load component health.</p>
    </div>
  </main>

  <!-- ============ AI side panel (persistent, collapsible) ============ -->
  <aside id="ai-panel" class="ai-panel" aria-label="AI analyst">
    <button id="ai-collapse" class="ai-collapse" aria-label="Collapse panel" title="Collapse">‹</button>
    <div class="ai-rail"><button class="ai-rail-btn" id="ai-expand" aria-label="Expand panel">AI ANALYST ›</button></div>
    <div class="ai-panel-inner">
    <header class="ai-panel-head">
      <div class="ai-panel-title">
        <h2>AI Analyst</h2>
      </div>
    </header>
    <div class="ai-panel-body">
      <section class="chat" aria-label="Analyst chat">
        <div class="chat-log" id="chat-log"></div>
        <form class="chat-form" id="chat-form">
          <input id="chat-input" type="text" placeholder="Ask about anything on this page…" autocomplete="off" maxlength="2000" aria-label="Ask about this review">
          <button class="btn btn-primary" type="submit" id="chat-send">Send</button>
        </form>
      </section>
      <p class="ai-footnote">Advisory only — AI-generated summaries never affect the gate decision.</p>
    </div>
    </div>
  </aside>
  <div id="ai-scrim" class="scrim" hidden></div>
  <button id="ai-fab" class="ai-fab" aria-label="Open AI analyst">AI</button>

  <!-- ============ artifact preview modal ============ -->
  <div id="preview-modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="Artifact preview">
    <div class="modal-box">
      <header class="modal-head">
        <strong id="preview-title" class="mono"></strong>
        <div>
          <button id="preview-download" class="btn">Download</button>
          <button id="preview-close" class="icon-btn" aria-label="Close">✕</button>
        </div>
      </header>
      <div id="preview-body" class="preview-body"></div>
    </div>
  </div>
</div>
</body>
</html>
